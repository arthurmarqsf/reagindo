<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e0b18">
<title>React Thurzão</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; height:100%; background:#07050d; color:#f4f4f5; font-family:Roboto,"Segoe UI",Arial,sans-serif; overflow:hidden; user-select:none; }
.app { display:grid; grid-template-columns: 1fr 360px; height:100%; }
.stage { position:relative; display:flex; flex-direction:column; min-width:0; padding:10px; gap:8px; }
.tela { position:relative; flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
canvas { max-width:100%; max-height:100%; aspect-ratio:16/9; background:#000; border-radius:14px; box-shadow:0 0 30px rgba(139,92,246,.25); }
.vazio { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; color:#a1a1aa; pointer-events:none; }
.vazio b { color:#fff; font-size:22px; }
.recbadge { position:absolute; top:14px; left:14px; display:none; align-items:center; gap:8px; background:#be123c; color:#fff; font-weight:800; padding:6px 12px; border-radius:999px; letter-spacing:.08em; }
.recbadge.on { display:flex; } .recbadge i { width:10px; height:10px; border-radius:50%; background:#fff; animation:pisca 1.2s infinite; }
@keyframes pisca { 50% { opacity:.3; } }
.player { display:flex; align-items:center; gap:8px; }
.player input[type=range] { flex:1; accent-color:#a78bfa; height:28px; }
.player span { font-variant-numeric:tabular-nums; font-size:13px; color:#a1a1aa; min-width:92px; text-align:right; }
.painel { overflow-y:auto; padding:10px 12px 20px; background:#0e0b18; border-left:1px solid rgba(255,255,255,.08); }
h2 { font-size:11px; letter-spacing:.2em; color:#a78bfa; margin:14px 2px 8px; font-weight:800; }
.g { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; } .g2 { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
button, .btn { border:1px solid rgba(255,255,255,.1); border-radius:14px; padding:10px 6px; background:linear-gradient(160deg,#1c1530,#140f22);
  color:#fff; font:700 13px Roboto,"Segoe UI",sans-serif; text-align:center; touch-action:manipulation; transition:transform .06s, box-shadow .15s; }
button:active { transform:scale(.94); }
button .e { display:block; font-size:24px; margin-bottom:3px; }
button.on { border-color:#ec4899; background:linear-gradient(160deg,#4c1d95,#831843); box-shadow:0 0 16px rgba(236,72,153,.45); }
button.toca { border-color:#22d3ee; box-shadow:0 0 16px rgba(34,211,238,.6); }
button:disabled { opacity:.4; }
#bRec { width:100%; padding:16px; font-size:19px; letter-spacing:.06em; background:linear-gradient(160deg,#991b1b,#be123c); border-color:#f43f5e; }
#bRec.gravando { background:#27272a; border-color:#f43f5e; box-shadow:0 0 22px rgba(244,63,94,.6); }
.linha { display:flex; gap:7px; align-items:center; } .linha > * { flex:1; }
.meter { height:6px; border-radius:6px; background:#27272a; overflow:hidden; margin-top:8px; } .meter i { display:block; height:100%; width:0; background:#4ade80; transition:width .08s; }
.status { font-size:12px; color:#a1a1aa; margin-top:8px; line-height:1.4; min-height:16px; }
select { width:100%; background:#18181b; color:#fff; border:1px solid #3f3f46; border-radius:10px; padding:8px; font-size:13px; }
label.chk { display:flex; align-items:center; gap:8px; font-size:13px; padding:6px 2px; } label.chk input { width:20px; height:20px; accent-color:#a78bfa; }
input[type=file] { display:none; }
@media (orientation: portrait) { .app { grid-template-columns:1fr; grid-template-rows: 46% 1fr; } .painel { border-left:0; border-top:1px solid rgba(255,255,255,.08); } }
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <div class="tela">
      <canvas id="cv" width="1920" height="1080"></canvas>
      <div class="vazio" id="vazio"><b>⚽ React Thurzão</b>1) Toque em <b style="font-size:15px">Abrir vídeo</b> e escolha o lance<br>2) Ligue a câmera e mande ver no <b style="font-size:15px">GRAVAR</b></div>
      <div class="recbadge" id="recbadge"><i></i><span id="rtime">00:00</span></div>
    </div>
    <div class="player">
      <button id="bPlay" style="width:56px">▶</button>
      <button id="bBack" style="width:56px">-5s</button>
      <button id="bFwd" style="width:56px">+5s</button>
      <input type="range" id="seek" min="0" max="1000" value="0">
      <span id="ptime">0:00 / 0:00</span>
    </div>
  </div>

  <div class="painel">
    <button id="bRec">⏺ GRAVAR</button>
    <div class="meter"><i id="meter"></i></div>
    <div class="status" id="status">Câmera desligada.</div>

    <h2>VÍDEO E CÂMERA</h2>
    <div class="g2">
      <label class="btn" for="fVideo"><span class="e" style="display:block;font-size:24px">🎬</span>Abrir vídeo</label>
      <button id="bCam"><span class="e">📷</span>Ligar câmera</button>
    </div>
    <input type="file" id="fVideo" accept="video/*">

    <h2>CÂMERA NA TELA</h2>
    <div class="g2" id="layouts"></div>

    <h2>SONS</h2>
    <div class="g" id="sons"></div>
    <div class="status" id="sonsInfo"></div>

    <h2>EXTRAS</h2>
    <div class="g2">
      <button id="bPop"><span class="e">🔔</span>Inscreva-se</button>
      <label class="btn" for="fSons"><span class="e" style="display:block;font-size:24px">📂</span>Importar sons</label>
    </div>
    <input type="file" id="fSons" accept="audio/*,.mp3" multiple>

    <h2>AJUSTES</h2>
    <label class="chk"><input type="checkbox" id="cFone" checked> Estou de fone (som mais limpo)</label>
    <label class="chk"><input type="checkbox" id="cEspelho"> Espelhar câmera</label>
    <label class="chk"><input type="checkbox" id="cDuck" checked> Abaixar o vídeo quando eu falo</label>
    <div class="linha" style="margin-top:6px">
      <select id="sQual"><option value="1080">Qualidade: 1080p (melhor)</option><option value="720">Qualidade: 720p (mais leve)</option></select>
    </div>
    <div class="linha" style="margin-top:8px">
      <span style="font-size:13px;color:#a1a1aa;flex:0 0 auto">Volume do vídeo</span>
      <input type="range" id="vVol" min="0" max="100" value="80" style="accent-color:#a78bfa">
    </div>
    <div class="status">Os vídeos vão para a pasta <b>Download</b> do tablet.</div>
  </div>
</div>
<video id="vid" playsinline preload="auto" style="display:none"></video>
<video id="cam" playsinline muted autoplay style="display:none"></video>
<script src="app.js?v=3"></script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
